name: FOSSA scan

on:
  push:
    branches: [ base-code ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  fossa-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Run upload-only action when secrets are available (push or PR from same repo)
      - name: Run FOSSA scan and upload
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: fossas/fossa-action@v1
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}

      # For PRs from forks (no secrets), run a local-only analysis so the run doesn't error
      - name: Run FOSSA local analyze (no upload) for fork PRs
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash
          fossa analyze || true
