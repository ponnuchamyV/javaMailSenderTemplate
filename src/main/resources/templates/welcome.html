<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Welcome Email</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .card { background: white; border-radius: 10px; padding: 20px; max-width: 600px; margin: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #2e86de; }
        p { font-size: 16px; }
        .footer { margin-top: 20px; font-size: 14px; color: #777; }
    </style>
</head>
<body>
<div class="card">
    <h2>Hello {{name}}, 👋</h2>
    <p>Welcome to <b>Sorim Techonologies</b>.</p>
    <p>Your Employee ID is <b>{{EmployeeID}}</b>.</p>
    <p>YOUR CTC : <b>{{CTC}}</b></p>
    <p>We’re happy to have you on board!</p>
    <div class="footer">
        <p>– Team Sorim</p>
    </div>
</div>
</body>
</html>
